spring:
  application:
    name: api

  # Database settings are supplied through environment variables in each runtime.
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5433/mealtalk}"
    username: "${DB_USERNAME:mealtalk}"
    password: "${DB_PASSWORD:mealtalk}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

mealtalk:
  auth:
    google-client-id: "${GOOGLE_CLIENT_ID:}"
    jwt-secret: "${JWT_SECRET:dev-only-mealtalk-jwt-secret-change-before-production}"
    access-token-ttl: "${ACCESS_TOKEN_TTL:2h}"

  cors:
    # Comma-separated explicit origins used by Expo web and deployed web clients.
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:8081}"

server:
  error:
    include-message: never
