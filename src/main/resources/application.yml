spring:
  # Load the Git-ignored local backend environment file when running Gradle here.
  # The extension hint makes Spring parse .env as Java properties.
  config:
    import: "optional:file:.env[.properties]"

  application:
    name: api

  # Database settings are supplied through environment variables in each runtime.
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5433/mealtalk}"
    username: "${DB_USERNAME:mealtalk}"
    password: "${DB_PASSWORD:mealtalk}"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # A meal photo is capped at 10 MiB by the sanitizer. The container limit is
      # set just above it so an oversized upload is refused as 413 by the servlet
      # before it is buffered, rather than being read into memory only to be
      # rejected. max-request-size leaves room for the small `meal` JSON part.
      max-file-size: 10MiB
      max-request-size: 12MiB

mealtalk:
  auth:
    google-client-id: "${GOOGLE_CLIENT_ID:}"
    jwt-secret: "${JWT_SECRET:dev-only-mealtalk-jwt-secret-change-before-production}"
    access-token-ttl: "${ACCESS_TOKEN_TTL:2h}"

  cors:
    # Comma-separated explicit origins used by Expo web and deployed web clients.
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:8081}"

  meal-photo-storage:
    # Private Cloudflare R2 bucket for meal photos, reached through its
    # S3-compatible API. Every value is backend-only and must never appear in the
    # Expo app. Leave them unset to boot without storage: photo uploads are then
    # refused with a storage error instead of crashing the application.
    endpoint: "${R2_ENDPOINT:}"
    access-key-id: "${R2_ACCESS_KEY_ID:}"
    secret-access-key: "${R2_SECRET_ACCESS_KEY:}"
    bucket: "${R2_BUCKET:}"
    region: "${R2_REGION:auto}"

  food-catalog:
    # 식품의약품안전처 식품영양성분DB on data.go.kr. The portal's general service
    # key is issued for this operation.
    base-url: "${FOOD_API_BASE_URL:https://apis.data.go.kr/1471000/FoodNtrCpntDbInfo02/getFoodNtrCpntDbInq02}"
    api-key: "${FOOD_API_KEY:}"
    max-results: 20

server:
  error:
    include-message: never
