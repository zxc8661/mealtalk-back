spring.application.name=api

# Database settings are supplied through environment variables in each runtime.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/mealtalk}
spring.datasource.username=${DB_USERNAME:mealtalk}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
mealtalk.auth.google-client-id=${GOOGLE_CLIENT_ID:}
mealtalk.auth.jwt-secret=${JWT_SECRET:dev-only-mealtalk-jwt-secret-change-before-production}
mealtalk.auth.access-token-ttl=${ACCESS_TOKEN_TTL:2h}

# Comma-separated explicit origins used by Expo web and deployed web clients.
mealtalk.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}

server.error.include-message=never
