spring.application.name=api

# Database settings are supplied through environment variables in each runtime.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mealtalk}
spring.datasource.username=${DB_USERNAME:mealtalk}
spring.datasource.password=${DB_PASSWORD:mealtalk}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.error.include-message=never
